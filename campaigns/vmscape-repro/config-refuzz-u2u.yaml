instruction_set: x86-64
instruction_categories:
  - BASE-BINARY
  - BASE-BITBYTE
  - BASE-CMOV
  - BASE-COND_BR
  - BASE-CONVERT
  - BASE-DATAXFER
  - BASE-FLAGOP
  - BASE-LOGICAL
  - BASE-MISC
  - BASE-NOP
  - BASE-POP
  - BASE-PUSH
  - BASE-SEMAPHORE
  - BASE-SETCC
  - BASE-WIDENOP

# FUZZING: guest USER -> guest USER cross-actor leaks (not covered by the Enter/Exit paper).
#   vmvictim = victim  (guest user, holds the secret; "secret injection" fuzzed body)
#   vm       = attacker/observer (guest user; "secret retrieval" fuzzed body; measures)
# ct-ni = the observer must not learn the victim's data across the guest boundary.
actors:
  - main:
    - mode: "host"
    - privilege_level: "kernel"
  - vmvictim:
    - mode: "guest"
    - privilege_level: "user"
  - vm:
    - mode: "guest"
    - observer: true
    - privilege_level: "user"
    - data_properties:
      - writable: false

contract_observation_clause: ct-ni

max_bb_per_function: 1

executor_mode: F+R
executor_sample_sizes:
  - 15
  - 40
  - 160
  - 320
executor_filtering_repetitions: 5
x86_enable_hpa_gpa_collisions: true

program_generator_seed: 0
data_generator_seed: 0
inputs_per_class: 2
analyser_stat_threshold: 0.5

enable_observation_filter: true
enable_fast_path_model: true

logging_modes:
  - info
