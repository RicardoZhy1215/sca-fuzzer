instruction_set: x86-64
instruction_categories:
  - BASE-BINARY
  - BASE-BITBYTE
  - BASE-CMOV
  - BASE-COND_BR
  - BASE-CONVERT
  - BASE-DATAXFER
  - BASE-FLAGOP
  - BASE-LOGICAL
  - BASE-MISC
  - BASE-NOP
  - BASE-POP
  - BASE-PUSH
  - BASE-SEMAPHORE
  - BASE-SETCC
  - BASE-WIDENOP

# FUZZING: guest USER (attacker) -> guest KERNEL (victim) cross-actor leaks (not in the Enter/Exit paper).
#   vmvictim = victim  (guest KERNEL, holds the secret; "secret injection" fuzzed body)
#   vm       = attacker/observer (guest USER; "secret retrieval" fuzzed body; measures)
# ct-ni = the guest-user observer must not learn the guest-kernel victim's data (privesc leak).
actors:
  - main:
    - mode: "host"
    - privilege_level: "kernel"
  - vmvictim:
    - mode: "guest"
    - privilege_level: "kernel"
  - vm:
    - mode: "guest"
    - observer: true
    - privilege_level: "user"
    - data_properties:
      - writable: false

contract_observation_clause: ct-ni

max_bb_per_function: 1

executor_mode: F+R
executor_sample_sizes:
  - 15
  - 40
  - 160
  - 320
executor_filtering_repetitions: 5
x86_enable_hpa_gpa_collisions: true

program_generator_seed: 0
data_generator_seed: 0
inputs_per_class: 2
analyser_stat_threshold: 0.5

enable_observation_filter: true
enable_fast_path_model: true

logging_modes:
  - info

# Overwrite some of the configuration options to reproduce the violation
data_generator_seed: 3939371791
inputs_per_class: 1
