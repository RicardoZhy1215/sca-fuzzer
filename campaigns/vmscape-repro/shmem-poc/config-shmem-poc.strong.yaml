# config-shmem-poc.strong.yaml — same as config-shmem-poc.yaml but with heavier measurement
# averaging, to push the fragile shared-mem transient signal past the priming/confirmation threshold
# without perf_env (which needs sudo). More repetitions + larger max sample + lower threshold.

instruction_set: x86-64
instruction_categories:
  - BASE-BINARY
  - BASE-BITBYTE
  - BASE-CMOV
  - BASE-COND_BR
  - BASE-CONVERT
  - BASE-DATAXFER
  - BASE-FLAGOP
  - BASE-LOGICAL
  - BASE-MISC
  - BASE-NOP
  - BASE-POP
  - BASE-PUSH
  - BASE-SEMAPHORE
  - BASE-SETCC
  - BASE-WIDENOP

actors:
  - main:
    - mode: "host"
    - privilege_level: "kernel"
  - vmvictim:
    - mode: "guest"
    - privilege_level: "kernel"
  - vm:
    - mode: "guest"
    - observer: true
    - privilege_level: "kernel"
    - data_properties:
      - writable: false

contract_observation_clause: ct-ni
contract_execution_clause:
  - delayed-exception-handling

max_bb_per_function: 1

executor_mode: F+R
executor_sample_sizes:
  - 40
  - 160
  - 320
  - 1000
  - 2000
executor_filtering_repetitions: 20

x86_enable_hpa_gpa_collisions: true

program_generator_seed: 20000000
data_generator_seed: 1000000
inputs_per_class: 2

analyser_stat_threshold: 0.15

enable_observation_filter: true
enable_fast_path_model: true

logging_modes:
  - info
