instruction_set: x86-64
instruction_categories:
  - BASE-BINARY
  - BASE-BITBYTE
  - BASE-CMOV
  - BASE-COND_BR
  - BASE-CONVERT
  - BASE-DATAXFER
  - BASE-FLAGOP
  - BASE-LOGICAL
  - BASE-MISC
  - BASE-NOP
  - BASE-POP
  - BASE-PUSH
  - BASE-SEMAPHORE
  - BASE-SETCC
  - BASE-WIDENOP

# STRONG-sampling variant of config-fuzz-u2k.yaml, for reliably REPRODUCING a near-threshold
# violation (the u2k fault leak fires only ~1/10 at the default sampling). Same actors/contract;
# only the measurement is beefed up so a ~7%-minority effect crosses the analyser threshold.
#   vmvictim = victim (guest KERNEL) ; vm = attacker/observer (guest USER)
actors:
  - main:
    - mode: "host"
    - privilege_level: "kernel"
  - vmvictim:
    - mode: "guest"
    - privilege_level: "kernel"
  - vm:
    - mode: "guest"
    - observer: true
    - privilege_level: "user"
    - data_properties:
      - writable: false

contract_observation_clause: ct-ni

max_bb_per_function: 1

executor_mode: F+R
# --- STRONGER measurement (vs [15,40,160,320]) so the weak minority signal is stable ---
executor_sample_sizes:
  - 80
  - 320
  - 1280
  - 2560
executor_filtering_repetitions: 10
x86_enable_hpa_gpa_collisions: true

program_generator_seed: 20000000
data_generator_seed: 1000000
inputs_per_class: 2
# threshold raised to 0.2 (stricter) — sensitivity sweep
analyser_stat_threshold: 0.2

enable_observation_filter: true
# fast-path model OFF — it tends to filter weak/near-threshold leaks as noise
enable_fast_path_model: false

logging_modes:
  - info
