# #DE divide error (div_r in action space) + delayed-exception-handling
# Fault axis config -- use ONE per training run:
#   python train.py --config fault_divzero_deh.yaml ...

instruction_set: x86-64

# Model
contract_observation_clause: ct
contract_execution_clause:
  - delayed-exception-handling

# Actors -- faulty page property drives the fault type
actors:
  - main:
    - data_properties:
      - present: true
# faults_allowlist -> generator may emit these + executor handled_faults gets the vector
faults_allowlist:
  - div-by-zero
  - div-overflow

# Executor
executor_mode: P+P
x86_executor_enable_ssbp_patch: true   # SSBD ON (Spectre-v4 excluded; fault-based only)

# Program generator
program_size: 50
avg_mem_accesses: 16
max_bb_per_function: 1
min_bb_per_function: 1
min_successors_per_bb: 1
max_successors_per_bb: 1

instruction_categories:
  - BASE-BINARY
  - BASE-BITBYTE
  - BASE-CMOV
  - BASE-COND_BR
  - BASE-CONVERT
  - BASE-DATAXFER
  - BASE-FLAGOP
  - BASE-LOGICAL
  - BASE-MISC
  - BASE-NOP
  - BASE-WIDENOP
  - BASE-POP
  - BASE-PUSH
  - BASE-SEMAPHORE
  - BASE-SETCC
  - LONGMODE-CONVERT
  - LONGMODE-DATAXFER
  - LONGMODE-SEMAPHORE
  - SSE-DATAXFER
  - SSE-LOGICAL_FP
  - SSE-MISC
  - SSE-SSE

# Input generator
data_generator_entropy_bits: 24
inputs_per_class: 2

# Fuzzer
enable_speculation_filter: true
enable_observation_filter: true
enable_fast_path_model: true
