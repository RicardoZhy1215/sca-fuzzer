# program_size=20, mem_ratio=0.75, n_regs=2, entropy_bits=24, n_inputs=50, value_mix=default, binary=on, flags=on, semaphore=off, locks=off, spec_filter=on
instruction_set: x86-64
contract_observation_clause: ct
contract_execution_clause:
  - seq
min_bb_per_function: 1
max_bb_per_function: 1
min_successors_per_bb: 1
max_successors_per_bb: 1
executor_mode: P+P
x86_executor_enable_ssbp_patch: false
inputs_per_class: 2
enable_observation_filter: true
enable_fast_path_model: true
logging_modes: [info]
program_generator_seed: 0
data_generator_seed: 0
program_size: 20
avg_mem_accesses: 15
data_generator_entropy_bits: 24
input_value_mix: default
enable_speculation_filter: true
instruction_categories:
  - BASE-DATAXFER
  - BASE-LOGICAL
  - BASE-MISC
  - BASE-BINARY
  - BASE-CMOV
  - BASE-SETCC
instruction_blocklist_append:
  - lock adc
  - lock add
  - lock and
  - lock btc
  - lock btr
  - lock bts
  - lock cmpxchg
  - lock cmpxchg16b
  - lock cmpxchg8b
  - lock dec
  - lock inc
  - lock neg
  - lock not
  - lock or
  - lock sbb
  - lock sub
  - lock xadd
  - lock xor
