# Divide-by-zero (#DE) against CT-VS-Ops (vspec-ops-div): the transient quotient may depend only on the
# faulting division's own operands. Violating it = Divider State Sampling (DSS, CVE-2023-20588): the
# value depends on an EARLIER division. Speculation at Fault: Zen+ only, after 80k test cases (the
# rarest result of the paper); Zen 3 clean for 112k; AMD lists only Zen 1 parts. Low prior on Zen 4:
# an exploratory run. Otherwise identical to de-dh.yaml.
instruction_set: x86-64
contract_observation_clause: ct
contract_execution_clause:
  - vspec-ops-div
faults_allowlist:
  - div-by-zero
min_bb_per_function: 1
max_bb_per_function: 1
min_successors_per_bb: 1
max_successors_per_bb: 1
executor_mode: P+P
x86_executor_enable_ssbp_patch: true
inputs_per_class: 2
enable_speculation_filter: true
enable_observation_filter: true
enable_fast_path_model: true
logging_modes: [info]
program_generator_seed: 0
data_generator_seed: 0
program_size: 32
avg_mem_accesses: 8
data_generator_entropy_bits: 16
instruction_categories:
  - BASE-BINARY
  - BASE-LOGICAL
  - BASE-BITBYTE
  - BASE-DATAXFER
  - BASE-CONVERT
  - BASE-FLAGOP
  - BASE-MISC
  - BASE-NOP
  - BASE-SETCC
