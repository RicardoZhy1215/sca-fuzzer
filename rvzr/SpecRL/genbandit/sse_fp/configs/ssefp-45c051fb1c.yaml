# program_size=64, mem_ratio=0.375, n_regs=6, entropy_bits=31, n_inputs=50, value_mix=default, binary=on, flags=on, semaphore=off, locks=on, spec_filter=off
instruction_set: x86-64
contract_observation_clause: ct
contract_execution_clause:
  - seq
min_bb_per_function: 1
max_bb_per_function: 1
min_successors_per_bb: 1
max_successors_per_bb: 1
executor_mode: P+P
x86_executor_enable_ssbp_patch: true
inputs_per_class: 2
enable_observation_filter: true
enable_fast_path_model: true
logging_modes: [info]
program_generator_seed: 0
data_generator_seed: 0
program_size: 64
avg_mem_accesses: 24
data_generator_entropy_bits: 31
input_value_mix: default
enable_speculation_filter: false
instruction_categories:
  - BASE-BINARY
  - BASE-CMOV
  - BASE-DATAXFER
  - BASE-LOGICAL
  - BASE-MISC
  - BASE-SETCC
  - SSE-SSE
  - SSE-DATAXFER
  - SSE-MISC
  - SSE-LOGICAL_FP
  - SSE2-SSE
  - SSE2-DATAXFER
  - SSE2-MISC
  - SSE2-LOGICAL_FP
  - SSE2-LOGICAL
  - SSE3-SSE
  - SSE3-DATAXFER
  - SSE4-LOGICAL
instruction_allowlist:
  - divps
  - divss
  - divpd
  - divsd
  - mulss
  - mulps
  - mulpd
  - mulsd
  - sqrtps
  - sqrtss
  - sqrtpd
  - sqrtsd
  - addps
  - addss
  - addpd
  - addsd
  - subps
  - subss
  - subpd
  - subsd
  - addsubpd
  - addsubps
  - haddpd
  - haddps
  - hsubpd
  - hsubps
  - cvtsi2ss
  - cvtss2si
  - cvttss2si
  - cvtsi2sd
  - cvtsd2si
  - cvttsd2si
  - cvtss2sd
  - cvtsd2ss
  - cvtdq2pd
  - cvtdq2ps
  - cvtpd2dq
  - cvttpd2dq
  - cvtps2dq
  - cvttps2dq
  - cvtpd2ps
  - cvtps2pd
  - roundss
  - roundsd
  - roundps
  - roundpd
  - blendps
  - blendpd
  - blendvps
  - blendvpd
  - insertps
  - extractps
