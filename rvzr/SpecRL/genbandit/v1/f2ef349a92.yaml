# program_size=8, mem_ratio=0.5, n_bb=5, successors=2, n_regs=6, entropy_bits=12, n_inputs=10, value_mix=full64
instruction_set: x86-64
contract_observation_clause: ct
contract_execution_clause:
  - no_speculation
instruction_categories:
  - BASE-COND_BR
  - BASE-BINARY
  - BASE-CMOV
  - BASE-DATAXFER
  - BASE-LOGICAL
  - BASE-MISC
  - BASE-SEMAPHORE
  - BASE-SETCC
executor_mode: P+P
x86_executor_enable_ssbp_patch: true
inputs_per_class: 2
enable_speculation_filter: true
enable_observation_filter: true
enable_fast_path_model: true
logging_modes: [info]
program_generator_seed: 0
data_generator_seed: 0
program_size: 8
avg_mem_accesses: 4
min_bb_per_function: 5
max_bb_per_function: 5
min_successors_per_bb: 2
max_successors_per_bb: 2
data_generator_entropy_bits: 12
input_value_mix: full64
